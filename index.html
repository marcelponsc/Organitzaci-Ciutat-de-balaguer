<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jornades · Vaga i activitats de centre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f5f7;--surface:#fff;--line:#e5e5ea;--line2:#efeff3;
  --ink:#18181b;--ink2:#4b4b55;--mut:#8a8a94;
  --pri:#3f3cbb;--pri2:#eeeefc;
  --ok:#14804a;--ok2:#eaf7ef;--bad:#d4322c;--bad2:#fdeeed;--acc:#d4322c;
  --warn:#a76300;--warn2:#fff6e5;--blue:#3f3cbb;--blue2:#eeeefc;
  --r:12px;--sh:0 1px 2px rgba(16,16,24,.04);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45;font-feature-settings:"cv11","ss01"}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;letter-spacing:-.015em;font-weight:650}
.num{font-variant-numeric:tabular-nums}

/* Capçalera */
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.6) blur(10px);-webkit-backdrop-filter:saturate(1.6) blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:30px;height:30px;border-radius:8px;background:var(--ink);display:grid;place-items:center;flex:none;position:relative}
.logo::after{content:"";position:absolute;top:-2px;right:-2px;width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid #fff}
.brand h1{font-size:15px;font-weight:700;white-space:nowrap;line-height:1.15}
.brand .centre{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.tabs{justify-self:center;display:flex;gap:2px;background:#ececf0;border-radius:10px;padding:3px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:var(--ink2);padding:6px 12px;font-size:13px;font-weight:550;border-radius:8px;white-space:nowrap;display:flex;align-items:center;gap:6px;line-height:1.2}
.tab:hover{color:var(--ink)}
.tab .step{font-size:11px;color:var(--mut);font-weight:600}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 .5px rgba(0,0,0,.04)}
.tab .sh{display:none}
.tab .n{font-size:10.5px;font-weight:700;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;display:inline-grid;place-items:center}
.tab .n.okn{background:transparent;color:var(--ok);min-width:auto;padding:0}
.right{display:flex;align-items:center;gap:8px}
.jbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:4px 10px 4px 5px;background:#fff;font-size:13px;max-width:330px;height:34px}
.jbtn:hover{border-color:#cfcfd6}
.jbtn .jt{font-size:11px;font-weight:650;padding:2px 7px;border-radius:6px;flex:none}
.jbtn .jt.vag{background:var(--bad2);color:var(--bad)}.jbtn .jt.act{background:var(--pri2);color:var(--pri)}
.jbtn .jn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.jbtn .jd{font-size:12px;color:var(--mut);white-space:nowrap}
.jbtn .jc{font-size:10px;color:var(--mut)}
.jsel{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:2px 8px 2px 2px;background:#fff}
.jsel input{border:0;background:transparent;padding:5px 6px;font-weight:600;font-size:13px}
.jsel .dia{font-size:12px;color:var(--mut);font-weight:500}
.jsel label{display:none}
.pill{font-size:12px;padding:5px 9px;border-radius:99px;color:var(--ink2);display:flex;align-items:center;gap:6px;white-space:nowrap;background:#f1f1f4}
.pill i{width:7px;height:7px;border-radius:50%;background:#a1a1aa;display:inline-block}
.pill.ok i{background:#22a35a}.pill.saving i{background:#e5a400}.pill.err i{background:var(--bad)}.pill.local i{background:var(--pri)}
@media (max-width:1020px){ .top:not(.measuring) .top-in{grid-template-columns:1fr auto;row-gap:8px} .top:not(.measuring) .tabs{grid-column:1/-1;grid-row:2;justify-self:stretch} .top:not(.measuring) .tab{flex:1;justify-content:center} }
.top.stack .top-in{grid-template-columns:1fr auto;row-gap:8px}
.top.stack .tabs{grid-column:1/-1;grid-row:2;justify-self:stretch}
.top.stack .tab{flex:1;justify-content:center}

main{max-width:1240px;margin:0 auto;padding:22px 20px 90px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:28px 0 10px;flex-wrap:wrap}
.sec-h h2{font-size:16px}
.sec-h p{margin:2px 0 0;color:var(--mut);font-size:12.5px}
.card-t{font-size:14px;margin-bottom:12px}
.hint{color:var(--mut);font-size:12.5px}
.banner{border-radius:10px;padding:9px 12px;margin-bottom:14px;font-size:13px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;border:1px solid transparent}
.banner.info{background:var(--pri2);color:#2e2b8f;border-color:#dddcf8}
.banner.warn{background:var(--warn2);color:#7a4a00;border-color:#f6e2b9}
.banner.err{background:var(--bad2);color:#9d1f1a;border-color:#f6d0cd}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.kpi{padding:13px 16px;position:relative}
.kpi .k{font-size:12px;font-weight:550;color:var(--mut)}
.kpi .v{font-weight:650;font-size:26px;line-height:1.15;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .v small{font-size:14px;color:var(--mut);font-weight:500;margin-left:3px;letter-spacing:0}
.kpi .s{font-size:12px;color:var(--ink2);margin-top:1px}
.kpi::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:transparent}
.kpi.warn::before{background:#e5a400}.kpi.bad::before{background:var(--bad)}.kpi.ok::before{background:#22a35a}

/* Botons */
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:0 12px;height:32px;font-size:13px;font-weight:550;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:var(--sh)}
.btn:hover{background:#fafafb;border-color:#d6d6dd}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri:hover{background:#2c2c33}
.btn.acc{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.acc:hover{background:#3532a3}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px;border-radius:7px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.ghost{background:none;border:1px solid var(--line);border-radius:7px;padding:3px 8px;font-size:12px;font-weight:550;color:var(--ink2);height:26px}
.ghost:hover{background:#f5f5f7}
.ghost:disabled{opacity:.4}
.linkb{background:none;border:0;color:var(--pri);font-weight:600;padding:0;font-size:inherit}
.row-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* Alumnes */
.lvl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.lvl{overflow:hidden}
.lvl-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line2)}
.lvl-h h3{font-size:15px}
.lvl-h .sub{font-size:12px;color:var(--mut);margin-top:1px}
.lvl-h .sub b{color:var(--ink)}
.agr-box{text-align:right}
.agr-box .lbl{font-size:11px;font-weight:550;color:var(--mut);margin-bottom:3px}
.agr-box .tiny{font-size:11.5px;color:var(--mut);margin-top:3px;line-height:1.35}
.grow{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px;padding:6px 14px;border-bottom:1px solid var(--line2);transition:background .15s}
.grow:last-child{border-bottom:0}
.grow .gname b{display:flex;align-items:center;gap:6px;font-weight:550;font-size:13.5px}
.grow .gname span{font-size:11.5px;color:var(--mut)}
.grow .gname b::before{content:"";width:6px;height:6px;border-radius:50%;background:#d4d4da;flex:none}
.grow.done .gname b::before{background:#22a35a}
.qk{display:flex;gap:3px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff;height:34px}
.stepper button{width:32px;height:100%;border:0;background:#f7f7f9;font-size:16px;font-weight:500;color:var(--ink2)}
.stepper button:hover{background:#efeff3}
.stepper input{width:48px;height:100%;border:0;border-left:1px solid var(--line2);border-right:1px solid var(--line2);text-align:center;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;-moz-appearance:textfield;background:#fff}
.stepper input:focus{outline:2px solid var(--pri);outline-offset:-2px}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper b{min-width:34px;text-align:center;font-size:14px;font-weight:650;font-variant-numeric:tabular-nums}
.stepper.sm{height:28px}
.stepper.sm button{width:28px;font-size:15px}
.badge{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:99px;background:#f0f0f3;color:var(--ink2)}
.badge.man{background:var(--pri2);color:var(--pri)}

/* Professorat */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0 10px}
.search{flex:1;min-width:200px;border:1px solid var(--line);border-radius:8px;padding:0 12px;height:32px;background:#fff;font-size:13px}
.search:focus,.field input:focus,.field select:focus,textarea:focus{outline:2px solid var(--pri2);border-color:var(--pri)}
.chips{display:flex;gap:2px;background:#ececf0;border-radius:8px;padding:2px}
.chip{border:0;background:none;border-radius:6px;padding:4px 10px;font-size:12.5px;font-weight:550;color:var(--ink2)}
.chip.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:8px;align-items:start}
.pcard{padding:0;overflow:hidden}
.prow{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px}
.pmain{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;display:flex;align-items:center;gap:10px}
.av{width:30px;height:30px;border-radius:50%;background:#efeff3;color:var(--ink2);display:grid;place-items:center;font-size:11px;font-weight:650;flex:none}
.pcard.is-p .av{background:var(--ok2);color:var(--ok)}
.pcard.is-v .av{background:var(--bad2);color:var(--bad)}
.pname{font-weight:550;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;background:#f1f1f4;border-radius:8px;padding:2px;gap:2px;flex:none}
.seg button{border:0;background:none;border-radius:6px;padding:4px 10px;font-weight:550;font-size:12px;color:var(--ink2)}
.seg button:hover{color:var(--ink)}
.seg button.on.p{background:var(--ok);color:#fff}
.seg button.on.v{background:var(--bad);color:#fff}
.seg button.on.c{background:var(--pri);color:#fff}
.pcard.is-c .av{background:var(--pri2);color:var(--pri)}
table.t td.co{color:var(--pri);font-weight:600}
.cchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cchip{display:inline-flex;align-items:center;gap:6px;background:var(--pri2);color:var(--pri);border-radius:99px;padding:4px 6px 4px 10px;font-size:12.5px;font-weight:600}
.cchip button{border:0;background:rgba(63,60,187,.12);color:var(--pri);width:20px;height:20px;border-radius:50%;font-size:12px;line-height:1;padding:0}
.pdet{padding:2px 12px 12px 52px;display:flex;flex-wrap:wrap;gap:5px}
.fbox{border:1px solid var(--line);border-radius:7px;padding:4px 8px;font-size:11.5px;background:#fff;text-align:left;min-width:108px}
.fbox b{display:block;font-size:11.5px;font-weight:600}
.fbox span{color:var(--mut)}
.fbox.act{border-color:#cdeadb;background:var(--ok2)}
.fbox.abs{background:#f6f6f8;color:var(--mut);text-decoration:line-through}
.fbox.none{opacity:.5}
.fbox.perm{border-color:#f1dfb3;background:var(--warn2)}

/* Assignació */
.fchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.fchip{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 11px;text-align:left;flex:none;min-width:118px;position:relative}
.fchip b{display:block;font-size:13px;font-weight:600}
.fchip span{font-size:11.5px;color:var(--mut)}
.fchip::after{content:"";position:absolute;top:9px;right:9px;width:7px;height:7px;border-radius:50%;background:#d4d4da}
.fchip.ok::after{background:#22a35a}.fchip.warn::after{background:#e5a400}.fchip.bad::after{background:var(--bad)}
.fchip.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.asg{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;align-items:start}
@media (max-width:880px){.asg{grid-template-columns:1fr}}
.aglist{display:flex;flex-direction:column;gap:6px}
.agc{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:8px 10px}
.agc .tag{font-weight:650;font-size:12.5px;border-radius:7px;padding:5px 8px;min-width:84px;line-height:1.2;background:#f3f3f6;border-left:3px solid #d4d4da}
.agc .tag small{display:block;font-weight:500;font-size:11px;color:var(--mut)}
.agc.cov .tag{border-left-color:#22a35a}
.agc.miss .tag{border-left-color:var(--bad);background:var(--bad2)}
.agc select{width:100%;border:1px solid var(--line);border-radius:8px;padding:0 8px;height:32px;background:#fff;font-size:13px;font-weight:500;min-width:0}
.agc .warnline{grid-column:1/-1;font-size:11.5px;color:var(--bad)}
.avl{padding:12px 14px;position:sticky;top:80px}
.avl h3{font-size:14px;margin-bottom:2px}
.avi{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line2);font-size:13px}
.avi:last-child{border-bottom:0}
.avi small{color:var(--mut);display:block;font-size:11.5px}
.avi .st{font-size:11px;font-weight:600;white-space:nowrap;align-self:center;padding:2px 7px;border-radius:99px}
.st.as{color:var(--ok);background:var(--ok2)}.st.res{color:var(--pri);background:var(--pri2)}
.check{display:flex;gap:7px;align-items:center;font-size:12.5px;color:var(--ink2)}
.check input{accent-color:var(--pri)}
.ag-title{display:flex;align-items:baseline;gap:10px;margin:4px 0 10px;flex-wrap:wrap}
.ag-title h2{font-size:16px}

/* Taules */
.tblw{overflow-x:auto}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.t th,table.t td{padding:7px 10px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle}
table.t th{font-size:11.5px;color:var(--mut);font-weight:550;background:#fafafb;white-space:nowrap}
table.t td.c,table.t th.c{text-align:center}
table.t td.miss{color:var(--bad);font-weight:600}
table.t td.res{color:var(--pri)}
table.t td.abs{color:#b4b4bc}
table.t tbody tr:last-child td{border-bottom:0}
table.t tbody tr:hover td{background:#fbfbfc}
table.t input[type=text],table.t input[type=number]{width:100%;border:1px solid transparent;border-radius:6px;padding:5px 7px;background:transparent;font-size:13px}
table.t input:hover,table.t input:focus{border-color:var(--line);background:#fff}
table.t input[type=number]{width:80px}
table.t tr.tot td{font-weight:650;background:#fafafb}

/* Quadre agrupacions (cursos a dalt) */
table.qg{font-size:12.5px;table-layout:auto}
table.qg th,table.qg td{border-right:1px solid var(--line2);padding:6px 8px}
table.qg thead th{text-align:center;color:var(--ink2)}
table.qg thead tr:first-child th{font-size:12.5px;font-weight:650;color:var(--ink);background:#f4f4f7}
table.qg thead th small{display:block;font-weight:500;color:var(--mut);font-size:10.5px}
table.qg .hcol{position:sticky;left:0;z-index:2;background:#fafafb;font-weight:600;white-space:nowrap;text-align:left;color:var(--ink)}
table.qg td.hcol{background:#fff}
table.qg td{min-width:62px;line-height:1.3;white-space:nowrap}
table.qg th,table.qg td{padding:6px 7px}
.qa td.cell{position:relative;padding:0;min-width:74px}
.qa td.cell .cv{display:block;padding:9px 8px;font-weight:500}
.qa td.cell.miss .cv{color:var(--bad);font-weight:600}
.qa td.cell.p:hover{background:var(--pri2)}
.qa td.cell.miss:hover{background:#fbdcda}
.qa td.cell .cellsel{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
.qa td.cell:focus-within{box-shadow:inset 0 0 0 2px var(--pri)}
.qa .hl{font-weight:600}
.qa .hs{font-size:11px;color:var(--mut);font-weight:500;display:flex;align-items:center;gap:5px;margin-top:1px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:#d4d4da}
.dot.ok{background:#22a35a}.dot.warn{background:#e5a400}.dot.bad{background:var(--bad)}
.pdfb{padding:10px 12px;margin-bottom:10px}
.pdfb.off{opacity:.55}
.pdfb-h{display:flex;gap:8px;align-items:center}
.pdfb-h input[type=text]{flex:1;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:600;font-size:13.5px}
table.pg{font-size:11.5px;table-layout:fixed;min-width:560px}
table.pg th:first-child{width:52px}
table.pg th,table.pg td{padding:3px 6px;border-right:1px solid var(--line2);white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
table.pg td.g{background:var(--ok2)}table.pg td.gu{background:var(--pri2);color:var(--pri)}table.pg td.al{background:var(--warn2);color:#7a4a00}
table.pg .pgh{color:var(--mut);font-weight:600}
.jlist{display:flex;flex-direction:column;gap:8px}
.jcard{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;cursor:pointer}
.jcard:hover{border-color:#cfcfd6}
.jcard.cur{box-shadow:0 0 0 2px var(--pri2);border-color:#c9c8f3}
.jcard-l{display:flex;align-items:center;gap:12px;min-width:0}
.jcard .jt{font-size:11px;font-weight:650;padding:3px 8px;border-radius:6px;flex:none}
.jt.vag{background:var(--bad2);color:var(--bad)}.jt.act{background:var(--pri2);color:var(--pri)}
.jcard-t{font-weight:600;font-size:14px}
.jcard-s{font-size:12px;color:var(--mut)}
.njg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:600px){.njg{grid-template-columns:1fr}}
.njt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.njt b{font-size:14px}.njt span{font-size:12.5px;color:var(--ink2)}
.njt.on{border-color:var(--pri);background:var(--pri2)}
.frchk{display:flex;flex-wrap:wrap;gap:6px}
.frc{border:1px solid var(--line);border-radius:8px;padding:5px 9px;background:#fff;cursor:pointer}
.frc.on{border-color:#c9c8f3;background:var(--pri2);color:var(--pri)}
.qa td.cell.cont .cv{color:var(--ink2)}
.nvchips{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.nvc{border:1px solid var(--line);background:#fff;border-radius:99px;padding:2px 8px;font-size:11.5px;font-weight:550;color:var(--ink2)}
.nvc.on{background:var(--pri2);border-color:#c9c8f3;color:var(--pri)}

.pad{padding:14px 16px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:12px;font-weight:550;color:var(--mut)}

code,.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#f1f1f4;padding:1px 5px;border-radius:5px}

/* Modal + toast */
.ov{position:fixed;inset:0;background:rgba(18,18,24,.38);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:48px 14px;overflow-y:auto}

.modal-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line2)}

.modal-b{padding:14px 18px;font-size:13.5px}
.modal-f{padding:10px 18px 16px;display:flex;justify-content:flex-end;gap:8px}
.x{border:0;background:#f1f1f4;width:28px;height:28px;border-radius:7px;font-size:16px;color:var(--ink2)}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:10px;z-index:80;font-size:13px;font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,.2);max-width:90vw}
.empty{text-align:center;padding:44px 20px}
.empty h2{font-size:18px;margin-bottom:6px}
.empty p{color:var(--ink2);max-width:500px;margin:0 auto 16px}
.welcome{padding:24px;display:grid;grid-template-columns:1.5fr 1fr;gap:24px;align-items:center;margin-bottom:16px}
@media (max-width:760px){.welcome{grid-template-columns:1fr}}
.welcome h2{font-size:20px;margin-bottom:8px}

<script>
(function(){
'use strict';

/* ---------- Utilitats ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
const sum = a => a.reduce((x,y)=>x+(+y||0),0);
const uid = () => Math.random().toString(36).slice(2,9);
const pad = n => String(n).padStart(2,'0');
const natCmp = (a,b) => String(a).localeCompare(String(b),'ca',{numeric:true,sensitivity:'base'});
const pct = (a,b) => b ? Math.round(a*100/b)+'%' : '–';
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
const VERSIO = '2026.11.12-c';
const DIES = ['Diumenge','Dilluns','Dimarts','Dimecres','Dijous','Divendres','Dissabte'];
const DIES_C = ['Dg','Dl','Dt','Dc','Dj','Dv','Ds'];
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fmtDate(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${+d}/${+m}/${y}`; }

const DEF_FRANGES = [
  {id:'f1',label:'8:00 – 9:00',lect:true},{id:'f2',label:'9:00 – 10:00',lect:true},
  {id:'f3',label:'10:00 – 11:00',lect:true},{id:'f4',label:'11:00 – 11:30 · Pati',lect:false},
  {id:'f5',label:'11:30 – 12:30',lect:true},{id:'f6',label:'12:30 – 13:30',lect:true},
  {id:'f7',label:'13:30 – 14:30',lect:true}
];
const T_INICI={id:'inici',label:'Inici',short:'⌂'}, T_CFG={id:'configuracio',label:'Configuració',short:'⚙︎',step:''};
const TABS_VAGA=[{id:'alumnes',label:'Alumnes',step:'1'},{id:'professorat',label:'Professorat',short:'Profes',step:'2'},{id:'assignacio',label:'Assignació',step:'3'},{id:'resum',label:'Resum',step:'4'}];
const TABS_ACT=[{id:'activitat',label:'Activitat',step:'1'},{id:'professorat',label:'Professorat',short:'Profes',step:'2'},{id:'assignacio',label:'Assignació',step:'3'},{id:'resum',label:'Resum',step:'4'}];
const ALL_TABS=['inici','alumnes','activitat','professorat','assignacio','resum','configuracio'];
function tabsFor(){ if(!S.jornada) return [T_INICI,T_CFG]; return [T_INICI,...(jTipus()==='activitat'?TABS_ACT:TABS_VAGA),T_CFG]; }

/* ---------- Estat ---------- */
const S = {
  config:{centre:'',ratio:25,franges:clone(DEF_FRANGES)},
  grups:[], profs:[], horari:{}, jornades:{},
  jornadaId:null, jornada:null,
  mode:'loading', readonly:false, sync:'loading',
  ui:{tab:'inici',franja:null,pf:'tots',cerca:'',exp:{},incFree:false}
};
let caps = {db:null,user:null,downloads:null};

/* ---------- Persistència ---------- */
const LS = 'vaga:';
function lsGet(k){ try{ const v=localStorage.getItem(LS+k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function lsPut(k,v){ try{ if(v===null) localStorage.removeItem(LS+k); else localStorage.setItem(LS+k,JSON.stringify(v)); return true; }catch(e){ return false; } }

const Store = {
  pending:{}, writing:{}, timers:{},
  save(path,data,delay=450){
    if(S.readonly){ toast('Només lectura: no tens permís per desar canvis.'); return; }
    this.pending[path]=clone(data);
    clearTimeout(this.timers[path]);
    this.timers[path]=setTimeout(()=>this.flush(path),delay);
    setSync('saving');
  },
  remove(path){ this.save(path,null,0); },
  isDirty(path){ return (path in this.pending) || !!this.writing[path]; },
  busy(){ return Object.keys(this.pending).length>0 || Object.values(this.writing).some(Boolean); },
  flushAll(){ Object.keys(this.pending).forEach(p=>this.flush(p)); },
  async flush(path){
    if(S.mode==='loading') return;
    if(this.writing[path] || !(path in this.pending)) return;
    const data=this.pending[path]; delete this.pending[path];
    this.writing[path]=true;
    try{
      if(caps.db){ if(data===null) await caps.db.doc(path).delete(); else await caps.db.doc(path).set(data); }
      else if(!lsPut(path,data)) toast("No s'ha pogut desar en aquest dispositiu.");
    }catch(e){ onWriteError(e,path,data); }
    finally{
      this.writing[path]=false;
      if(path in this.pending) this.flush(path);
      else if(!this.busy() && S.sync!=='err') setSync(S.mode==='local'?'local':'ok');
    }
  }
};
function onWriteError(e,path,data){
  const code=e&&e.code;
  if(code==='unavailable' && !e._retried){
    setTimeout(()=>{ if(!(path in Store.pending)){ Store.pending[path]=data; Store.flush(path);} }, 600+Math.random()*900);
    return;
  }
  if(code==='invalid_argument'){ S.readonly=true; toast('No tens permís per desar canvis en aquesta app (demana accés com a col·laborador).'); render(); }
  else if(code==='quota_exceeded'){ toast("S'ha arribat al límit d'espai de dades. Esborra jornades antigues."); }
  else if(code==='revoked'){ toast("S'ha retirat l'accés a les dades."); }
  else toast("Error en desar. Torna-ho a provar.");
  setSync('err');
}
function setSync(s){
  S.sync=s;
  const el=$('#sync'); if(!el) return;
  const txt={loading:'Connectant…',ok:'Desat · compartit',saving:'Desant…',err:'Error de connexió',local:'Mode local',slow:'Sense connexió encara…',ro:'Només lectura'}[s]||'';
  el.className='pill '+({ok:'ok',saving:'saving',err:'err',slow:'err',local:'local'}[s]||'');
  el.querySelector('span').textContent = S.readonly && s==='ok' ? 'Només lectura' : txt;
}

function normConfig(d){
  return {
    centre:(d&&d.centre)||'',
    ratio:(d&&+d.ratio>0)?+d.ratio:25,
    franges:(d&&Array.isArray(d.franges)&&d.franges.length)?d.franges:clone(DEF_FRANGES)
  };
}
const saveConfig=()=>Store.save('app/config',S.config);
const saveGrups=()=>Store.save('app/grups',{llista:S.grups});
const saveProfs=()=>Store.save('app/professors',{llista:S.profs});
const saveHorari=()=>Store.save('app/horari',{h:S.horari},700);
function saveJ(){ if(S.jornada&&S.jornadaId){ if(!S.jornada.data) S.jornada.data=S.jornadaId.slice(0,10); S.jornades[S.jornadaId]=S.jornada; Store.save('jornades/'+S.jornadaId,S.jornada); } }
const jTipus = () => (S.jornada&&S.jornada.tipus)||'vaga';
const jDate = () => (S.jornada&&S.jornada.data)||(S.jornadaId?S.jornadaId.slice(0,10):todayISO());
const jTitol = j => (j.tipus==='activitat'?(j.nom||'Activitat de centre'):(j.nom||'Dia de vaga'));
function ensureJ(){
  if(!S.jornada){ if(!S.jornadaId) S.jornadaId=todayISO(); S.jornada={tipus:'vaga',data:S.jornadaId.slice(0,10),alumnes:{},profs:{},agr:{},assign:{},diaHorari:null}; S.jornades[S.jornadaId]=S.jornada; }
  const j=S.jornada; j.alumnes=j.alumnes||{}; j.profs=j.profs||{}; j.agr=j.agr||{}; j.assign=j.assign||{};
  return j;
}

function loadLocal(){
  S.config=normConfig(lsGet('app/config'));
  S.grups=(lsGet('app/grups')||{}).llista||[];
  S.profs=(lsGet('app/professors')||{}).llista||[];
  S.horari=(lsGet('app/horari')||{}).h||{};
  const m={};
  try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith(LS+'jornades/')){ const id=k.slice((LS+'jornades/').length); m[id]=lsGet('jornades/'+id); } } }catch(e){}
  S.jornades=m; S.jornada=S.jornadaId?(m[S.jornadaId]||null):null;
}

function subscribe(){
  const db=caps.db; let first=false;
  const timer=setTimeout(()=>{ if(!first) setSync('slow'); },10000);
  const got=snap=>{ if(!first && !snap.metadata.fromCache){ first=true; clearTimeout(timer); if(!Store.busy()) setSync('ok'); } };
  const docs={
    'app/config':d=>{ S.config=normConfig(d); },
    'app/grups':d=>{ S.grups=(d&&d.llista)||[]; },
    'app/professors':d=>{ S.profs=(d&&d.llista)||[]; },
    'app/horari':d=>{ S.horari=(d&&d.h)||{}; }
  };
  Object.entries(docs).forEach(([p,fn])=>{
    db.doc(p).onSnapshot(snap=>{ got(snap); if(Store.isDirty(p)) return; fn(snap.exists?clone(snap.data()):null); scheduleRender(); },
      ()=>{ clearTimeout(timer); setSync('err'); });
  });
  db.collection('jornades').onSnapshot(qs=>{
    got(qs);
    const m={};
    qs.docs.forEach(d=>{ m[d.id]=clone(d.data()); });
    Object.keys(S.jornades).forEach(id=>{ if(Store.isDirty('jornades/'+id)) m[id]=S.jornades[id]; });
    S.jornades=m; S.jornada=S.jornadaId?(m[S.jornadaId]||null):null;
    if(!S.jornada&&S.ui.tab!=='inici'&&S.ui.tab!=='configuracio') S.ui.tab='inici';
    scheduleRender();
  },()=>{ clearTimeout(timer); setSync('err'); });
}

let needRender=false;
function inputFocused(){ const a=document.activeElement; return a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName); }
function scheduleRender(){ if(inputFocused()){ needRender=true; return; } render(); }
document.addEventListener('focusout',()=>setTimeout(()=>{ if(needRender && !inputFocused()){ needRender=false; render(); } },60));

/* ---------- Model ---------- */
const grupById = id => S.grups.find(g=>g.id===id);
const profById = id => S.profs.find(p=>p.id===id);
const lectFranges = () => S.config.franges.filter(f=>f.lect);
const franjaById = id => S.config.franges.find(f=>f.id===id);
function etapa(nv){ const n=norm(nv); return /eso/.test(n)?0:/batx|bach/.test(n)?1:/cf|cicle|ciclo|fp|pfi/.test(n)?2:3; }
const grupCmp=(a,b)=>etapa(a.nivell||a.nom)-etapa(b.nivell||b.nom)||natCmp(a.nom,b.nom);
function nivells(){ return [...new Set(S.grups.map(g=>g.nivell||'Sense nivell'))].sort((a,b)=>etapa(a)-etapa(b)||natCmp(a,b)); }
function nivellDe(nom){ const s=String(nom||'').trim(); const m=s.match(/^(.*\S)\s+[A-Za-z0-9]$/); return m?m[1]:s; }
function diaHorari(){
  const j=S.jornada; if(j&&j.diaHorari) return +j.diaHorari;
  return new Date(jDate()+'T12:00:00').getDay();
}
function act(pid,dia,fid){
  const v=S.horari[pid]&&S.horari[pid][dia+'-'+fid]; if(!v) return null;
  if(v==='GU') return {t:'GU'};
  if(v.startsWith('G:')) return {t:'G',grup:v.slice(2)};
  if(v.startsWith('AL:')) return {t:'AL',txt:v.slice(3)};
  if(v.startsWith('C:')) return {t:'C',txt:v.slice(2)};
  return null;
}
function actLabel(a){
  if(!a) return 'Sense horari';
  if(a.t==='GU') return 'Guàrdia';
  if(a.t==='G'){ const g=grupById(a.grup); return g?'Classe · '+g.nom:'Classe'; }
  if(a.t==='C') return 'Classe · '+a.txt;
  return a.txt||'Altres';
}
const isPerm = a => !!a && a.t==='AL';
function actShort(a){ if(!a) return 'sense classe'; if(a.t==='AL'&&jTipus()==='vaga') return 'permanència · '+(a.txt||''); if(a.t==='GU') return 'guàrdia'; if(a.t==='G'){ const g=grupById(a.grup); return g?'tenia '+g.nom:'classe'; } if(a.t==='C') return 'tenia '+a.txt; return a.txt||'altres'; }
const isClass = a => !!a && (a.t==='G'||a.t==='C');
function actNivell(a){ if(!a) return null; if(a.t==='G'){ const g=grupById(a.grup); return g?g.nivell:null; } if(a.t==='C') return a.txt; return null; }
const curt = n => { const p=parts(n); return p.cog? p.nom+' '+p.cog[0]+'.' : p.nom; };
const isWork = a => !!a && (a.t==='G'||a.t==='C'||a.t==='GU');
const pEstat = id => { const p=S.jornada&&S.jornada.profs&&S.jornada.profs[id]; if(p&&p.e) return p.e; return S.jornada&&jTipus()==='activitat'?'P':null; };
const pAbs = id => (S.jornada&&S.jornada.profs&&S.jornada.profs[id]&&S.jornada.profs[id].abs)||[];
function disponibles(fid,incFree){
  const dia=diaHorari();
  return S.profs.filter(p=>pEstat(p.id)==='P' && !pAbs(p.id).includes(fid))
    .map(p=>({p,a:act(p.id,dia,fid)}))
    .filter(x=>incFree || !!x.a);
}
function nivellStats(){
  const al=(S.jornada&&S.jornada.alumnes)||{}, agr=(S.jornada&&S.jornada.agr)||{};
  return nivells().map(nv=>{
    const gs=S.grups.filter(g=>(g.nivell||'Sense nivell')===nv).sort((a,b)=>natCmp(a.nom,b.nom));
    const mat=sum(gs.map(g=>g.alumnes));
    const comptats=gs.filter(g=>al[g.id]!=null);
    const pres=sum(comptats.map(g=>al[g.id]));
    const rec=pres>0?Math.ceil(pres/(S.config.ratio||25)):0;
    const manual=agr[nv]!=null;
    const n=manual?+agr[nv]:rec;
    return {nv,gs,mat,pres,pendents:gs.length-comptats.length,rec,n,manual};
  });
}
function agrupacions(){
  const out=[];
  nivellStats().forEach(s=>{
    for(let i=0;i<s.n;i++){
      const base=Math.floor(s.pres/s.n), extra=i<(s.pres%s.n)?1:0;
      out.push({id:s.nv+'#'+(i+1),nv:s.nv,idx:i+1,alumnes:base+extra});
    }
  });
  return out;
}
function parts(n){ const s=String(n||'').trim().replace(/\s+/g,' '); if(s.includes(',')){ const i=s.indexOf(','); return {nom:s.slice(i+1).trim(),cog:s.slice(0,i).trim()}; } const w=s.split(' '); return {nom:w[0]||'',cog:w.slice(1).join(' ')}; }
const nomLl = n => { const p=parts(n); return p.cog?p.cog+', '+p.nom:p.nom; };
const profCmp = (a,b) => { const x=parts(a.nom), y=parts(b.nom); return natCmp(x.cog,y.cog)||natCmp(x.nom,y.nom); };
const inicials = n => { const p=parts(n); return ((p.nom[0]||'')+(p.cog[0]||'')).toUpperCase(); };
const agLabel = ag => `${ag.nv} · G${ag.idx}`;
function fApplies(f,nv){ if(typeof f==='string') f=franjaById(f); return !f||!Array.isArray(f.nivells)||!f.nivells.length||f.nivells.includes(nv); }
const agsAt = fid => agrupacions().filter(a=>fApplies(fid,a.nv));
function agById(id){ return agrupacions().find(a=>a.id===id); }
function coverage(fid){
  const ags=agsAt(fid), asg=(S.jornada&&S.jornada.assign&&S.jornada.assign[fid])||{};
  const av=disponibles(fid,S.ui.incFree), ids=new Set(av.map(x=>x.p.id));
  const cov=ags.filter(a=>asg[a.id]&&ids.has(asg[a.id])).length;
  return {cov,need:ags.length,av:av.length};
}

/* ---------- Assignació automàtica ---------- */
function autoAssign(fid,prevFid){
  const j=ensureJ(); const ags=agsAt(fid);
  const av=disponibles(fid,S.ui.incFree);
  const byId=Object.fromEntries(av.map(x=>[x.p.id,x]));
  const used=new Set(), res={};
  const take=(ag,pid)=>{ res[ag.id]=pid; used.add(pid); };
  const free=x=>!used.has(x.p.id);
  // 1. continuïtat amb l'hora anterior
  if(prevFid && j.assign[prevFid]){
    ags.forEach(ag=>{ const pid=j.assign[prevFid][ag.id]; if(pid && byId[pid] && !used.has(pid)) take(ag,pid); });
  }
  // 2. professor que tenia classe amb un grup del mateix nivell
  ags.forEach(ag=>{ if(res[ag.id]) return; const c=av.find(x=>free(x)&&actNivell(x.a)===ag.nv); if(c) take(ag,c.p.id); });
  // 3. qualsevol professor amb classe a aquesta hora
  ags.forEach(ag=>{ if(res[ag.id]) return; const c=av.find(x=>free(x)&&isClass(x.a)); if(c) take(ag,c.p.id); });
  // 4. professorat de guàrdia
  ags.forEach(ag=>{ if(res[ag.id]) return; const c=av.find(x=>free(x)&&x.a&&x.a.t==='GU'); if(c) take(ag,c.p.id); });
  // 5. altres presents (només si s'inclouen)
  ags.forEach(ag=>{ if(res[ag.id]) return; const c=av.find(x=>free(x)&&isPerm(x.a)); if(c) take(ag,c.p.id); });
  ags.forEach(ag=>{ if(res[ag.id]) return; const c=av.find(free); if(c) take(ag,c.p.id); });
  j.assign[fid]=res;
  return {cov:Object.keys(res).length,need:ags.length};
}

/* ----- 3. Assignació ----- */
function vAssign(){
  if(!S.grups.length||!S.profs.length) return emptyView('Falten dades','Per assignar professorat cal tenir grups, professorat i horari a Configuració.');
  const lf=lectFranges();
  if(!lf.length) return emptyView('No hi ha franges lectives','Defineix les franges horàries a Configuració.');
  const ags=agrupacions(), st=nivellStats().filter(x=>x.n>0);
  const head=`<div class="sec-h" style="margin-top:0"><div><h2>Assignació per hores</h2><p>Toca una casella per triar el professor. ${S.ui.incFree?'Disponible = present al centre.':'Disponible = present i amb classe o guàrdia aquella hora.'}</p></div>
    <div class="row-actions">
      <button class="btn acc" data-a="asg-auto-all" ${ags.length?'':'disabled'}>Proposta automàtica</button>
      <button class="btn danger" data-a="asg-clear-all" ${ags.length?'':'disabled'}>Buidar tot</button>
    </div></div>
    <label class="check" style="margin-bottom:12px"><input type="checkbox" data-in="incfree" ${S.ui.incFree?'checked':''}> Incloure també professors presents sense classe ni guàrdia a aquella hora</label>`;
  if(!ags.length) return head+`<div class="card empty"><h2>Encara no hi ha agrupacions</h2><p>Fes primer el recompte d'alumnes: les agrupacions per nivell surten d'aquí.</p><button class="btn pri" data-a="tab" data-tab="alumnes">Anar al recompte</button></div>`;
  const reserves={};
  const rows=lf.map(f=>{
    const asg=(S.jornada&&S.jornada.assign&&S.jornada.assign[f.id])||{};
    const av=disponibles(f.id,S.ui.incFree); const avIds=new Set(av.map(x=>x.p.id));
    const where={}; ags.forEach(ag=>{ if(asg[ag.id]&&avIds.has(asg[ag.id])) where[asg[ag.id]]=ag.id; });
    const cov=Object.keys(where).length;
    reserves[f.id]=av.filter(x=>!where[x.p.id]).sort((x,y)=>profCmp(x.p,y.p)).map(x=>curt(x.p.nom));
    const nApl=ags.filter(ag=>fApplies(f,ag.nv)).length;
    const cells=ags.map(ag=>{
      if(!fApplies(f,ag.nv)) return `<td class="na ${ag.idx===1?'nvs':''}" title="Aquest nivell no té classe en aquesta franja">—</td>`;
      const cur=asg[ag.id], ok=cur&&avIds.has(cur);
      const rank=x=>actNivell(x.a)===ag.nv?0:isClass(x.a)?1:x.a&&x.a.t==='GU'?2:3;
      const lliuresT=av.filter(x=>!where[x.p.id]||x.p.id===cur).sort((x,y)=>rank(x)-rank(y)||profCmp(x.p,y.p));
      const lliures=lliuresT.filter(x=>isWork(x.a)), perm=lliuresT.filter(x=>!isWork(x.a));
      const ocupats=av.filter(x=>where[x.p.id]&&x.p.id!==cur).sort((x,y)=>profCmp(x.p,y.p));
      const opt=x=>`<option value="${x.p.id}" ${x.p.id===cur?'selected':''}>${esc(nomLl(x.p.nom))} · ${esc(actShort(x.a))}</option>`;
      const sel=`<select class="cellsel" data-in="asg" data-f="${f.id}" data-ag="${esc(ag.id)}" aria-label="${esc(agLabel(ag))} ${esc(f.label)}">
        <option value="">${ok?'— Treure —':'Triar…'}</option>
        ${lliures.length?`<optgroup label="Lliures (${lliures.length})">${lliures.map(opt).join('')}</optgroup>`:''}
        ${perm.length?`<optgroup label="Permanència al centre · només si cal (${perm.length})">${perm.map(opt).join('')}</optgroup>`:''}
        ${ocupats.length?`<optgroup label="Ja assignats (es mouran aquí)">${ocupats.map(x=>`<option value="${x.p.id}">${esc(nomLl(x.p.nom))} · ara a ${esc(agLabel(agById(where[x.p.id])))}</option>`).join('')}</optgroup>`:''}
      </select>`;
      return `<td class="cell ${ok?'p':'miss'} ${ag.idx===1?'nvs':''}" title="${ok?esc(profById(cur).nom):''}"><span class="cv">${ok?esc(curt(profById(cur).nom)):'Triar…'}</span>${sel}</td>`;
    }).join('');
    const cls=cov>=nApl?'ok':cov?'warn':'bad';
    return `<tr><td class="hcol"><div class="hl">${esc(f.label)}</div><div class="hs"><i class="dot ${cls}"></i>${cov}/${nApl} · ${av.length} disp.</div></td>${cells}</tr>`;
  }).join('');
  const table=`<div class="card tblw"><table class="t qg qa"><thead>
    <tr><th class="hcol" rowspan="2">Hora</th>${st.map(x=>`<th class="nvs" colspan="${x.n}">${esc(x.nv)}<small>${x.pres} alumnes</small></th>`).join('')}</tr>
    <tr>${ags.map(ag=>`<th class="${ag.idx===1?'nvs':''}">G${ag.idx}<small>≈ ${ag.alumnes} al.</small></th>`).join('')}</tr>
  </thead><tbody>${rows}</tbody></table></div>`;
  const resv=`<div class="card resv"><div class="resv-h">Professorat lliure (reserva / guàrdia) per hora</div>${lf.map(f=>`<div class="resv-r"><b>${esc(f.label)}</b><span>${reserves[f.id].length?`<em>${reserves[f.id].length}</em> `+esc(reserves[f.id].join(', ')):'<span class="hint">Ningú</span>'}</span></div>`).join('')}</div>`;
  return head+table+resv;
}

function profCell(pid,fid){
  const a=(S.jornada&&S.jornada.assign&&S.jornada.assign[fid])||{};
  const ags=agrupacions(); const ag=ags.find(x=>a[x.id]===pid);
  const avail=disponibles(fid,S.ui.incFree).some(x=>x.p.id===pid);
  if(pAbs(pid).includes(fid)) return {txt:'Absent',cls:'abs'};
  if(ag&&avail) return {txt:agLabel(ag),cls:''};
  if(avail) return {txt:isPerm(act(pid,diaHorari(),fid))?'Reserva (perm.)':'Reserva',cls:'res'};
  return {txt:'–',cls:'abs'};
}
function resumText(){
  const st=nivellStats(), lf=lectFranges(), ags=agrupacions();
  const mat=sum(st.map(s=>s.mat)), pres=sum(st.map(s=>s.pres));
  const P=S.profs.filter(p=>pEstat(p.id)==='P').length;
  let t=`DIA DE VAGA · ${fmtDate(jDate())}${S.config.centre?' · '+S.config.centre:''}\n\n`;
  t+=`ALUMNAT: ${pres}/${mat} presents (${pct(pres,mat)})\n`;
  st.forEach(s=>{ t+=`· ${s.nv}: ${s.pres} alumnes → ${s.n} agrupaci${s.n===1?'ó':'ons'}\n`; });
  t+=`\nPROFESSORAT: ${P}/${S.profs.length} presents\n`;
  lf.forEach(f=>{
    const a=(S.jornada&&S.jornada.assign&&S.jornada.assign[f.id])||{};
    const av=disponibles(f.id,S.ui.incFree); const ids=new Set(av.map(x=>x.p.id));
    t+=`\n${f.label}\n`;
    ags.filter(ag=>fApplies(f,ag.nv)).forEach(ag=>{ const pid=a[ag.id]; t+=`· ${agLabel(ag)}: ${pid&&ids.has(pid)?profById(pid).nom:'SENSE PROFESSOR'}\n`; });
    const used=new Set(ags.map(ag=>a[ag.id]).filter(Boolean));
    const r=av.filter(x=>!used.has(x.p.id)).sort((x,y)=>profCmp(x.p,y.p)).map(x=>x.p.nom);
    if(r.length) t+=`· Reserva/guàrdia: ${r.join(', ')}\n`;
  });
  return t;
}
function csvQuadre(){
  const lf=lectFranges(), ags=agrupacions();
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['Agrupació','Alumnes',...lf.map(f=>f.label)]];
  ags.forEach(ag=>{
    rows.push([agLabel(ag),ag.alumnes,...lf.map(f=>{ if(!fApplies(f,ag.nv)) return '—'; const a=(S.jornada&&S.jornada.assign&&S.jornada.assign[f.id])||{}; const pid=a[ag.id]; return pid&&disponibles(f.id,S.ui.incFree).some(x=>x.p.id===pid)?profById(pid).nom:'SENSE PROFESSOR'; })]);
  });
  rows.push([]); rows.push(['Professor/a','',...lf.map(f=>f.label)]);
  S.profs.filter(p=>pEstat(p.id)==='P').sort(profCmp).forEach(p=>rows.push([nomLl(p.nom),'',...lf.map(f=>profCell(p.id,f.id).txt)]));
  return '﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n');
}

function rangF(f){ const m=String(f.label).match(/(\d{1,2})[:.h](\d{2})\D+(\d{1,2})[:.h](\d{2})/); return m?[(+m[1])*60+(+m[2]),(+m[3])*60+(+m[4])]:null; }
function solapen(a,b){ const ra=rangF(a), rb=rangF(b); return !!ra&&!!rb&&ra[0]<rb[1]&&rb[0]<ra[1]; }
function detectNivells(totes){
  const lf=lectFranges(), all=nivells(); let n=0;
  lf.forEach(f=>{
    if(!lf.some(o=>o!==f&&solapen(f,o))) return;           // només franges que se solapen amb una altra
    if(!totes&&(f.nivells||[]).length&&!f.nivAuto) return;   // respecta els canvis fets a mà
    const cnt={};
    Object.values(S.horari).forEach(h=>{ for(let d=1;d<=5;d++){ const v=h[d+'-'+f.id]; if(!v) continue; let nv=null;
      if(v.startsWith('G:')){ const g=grupById(v.slice(2)); nv=g&&g.nivell; } else if(v.startsWith('C:')) nv=v.slice(2);
      if(nv) cnt[nv]=(cnt[nv]||0)+1; } });
    const nivs=all.filter(x=>cnt[x]);
    if(nivs.length&&nivs.length<all.length&&JSON.stringify(nivs)!==JSON.stringify(f.nivells||[])){ f.nivells=nivs; f.nivAuto=true; n++; }
  });
  if(n) saveConfig();
  return n;
}

  const card=([id,j])=>{
    const a=j.tipus==='activitat'; const dt=j.data||id.slice(0,10); const d=new Date(dt+'T12:00:00').getDay();

      stats=`${cols.length} elements · ${n} places · ${fr} hores${co?` · ${co} a coordinació`:''}${abs?` · ${abs} absents`:''}`; }
    else { const al=Object.values(j.alumnes||{}); const pres=sum(al); const P=Object.values(j.profs||{}).filter(p=>p.e==='P').length;

    return `<div class="card jcard ${id===S.jornadaId?'cur':''}" data-a="open-j" data-id="${esc(id)}" role="button" tabindex="0">

const actFranges = () => { const ids=(S.jornada&&S.jornada.fr)||[]; return S.config.franges.filter(f=>ids.includes(f.id)); };
const actCols = () => ((S.jornada&&S.jornada.cols)||[]).filter(c=>(+c.n||0)>0);
function colNom(c){ if(c.tipus==='grup'){ const g=grupById(c.grup); return g?g.nom:(c.nom||'Grup'); } return c.nom||'Lloc'; }
function actSlots(){ const out=[]; actCols().forEach(c=>{ for(let k=1;k<=(+c.n||0);k++) out.push({id:c.id+'#'+k,col:c,k}); }); return out; }
function actCoverage(fid){
  const asg=(S.jornada&&S.jornada.assign&&S.jornada.assign[fid])||{};
  const av=disponibles(fid,S.ui.incFree), ids=new Set(av.map(x=>x.p.id));
  const slots=actSlots().filter(s=>slotApplies(s,fid)); return {cov:slots.filter(s=>asg[s.id]&&ids.has(asg[s.id])).length,need:slots.length,av:av.length};
}
function slotApplies(sl,f){ if(sl.col.tipus!=='grup') return true; const g=grupById(sl.col.grup); return !g||fApplies(f,g.nivell); }
const teachesAt=(pid,gid,dia,fid)=>{ const a=act(pid,dia,fid); return !!a&&a.t==='G'&&a.grup===gid; };

/* ----- 3. Assignació (activitat) ----- */
function autoAssignAct(){
  const j=ensureJ(); const fr=actFranges(); const slots=actSlots(); const dia=diaHorari();
  const av={}; fr.forEach(f=>{ av[f.id]=new Set(disponibles(f.id,S.ui.incFree).map(x=>x.p.id)); });
  const used={}; fr.forEach(f=>used[f.id]=new Set());
  const res={}; fr.forEach(f=>res[f.id]={});
  const freeHours=pid=>fr.filter(f=>av[f.id].has(pid)&&!used[f.id].has(pid)).length;
  const teachCount=(pid,gid)=>fr.filter(f=>teachesAt(pid,gid,dia,f.id)).length;
  // 1. titular per a cada plaça (prioritat: grups amb tutor, després grups, després llocs)
  const order=slots.slice().sort((a,b)=>{ const r=s=>s.col.tipus==='grup'?(grupById(s.col.grup)&&grupById(s.col.grup).tutor&&s.k===1?0:1):2; return r(a)-r(b); });
  order.forEach(sl=>{
    const gid=sl.col.tipus==='grup'?sl.col.grup:null; const g=gid?grupById(gid):null;
    let best=null,bs=-1; const frS=fr.filter(f=>slotApplies(sl,f));
    S.profs.forEach(p=>{ const fh=frS.filter(f=>av[f.id].has(p.id)&&!used[f.id].has(p.id)).length; if(!fh) return;
      let sc=fh*10; if(g&&g.tutor===p.id&&sl.k===1) sc+=1000; if(gid) sc+=teachCount(p.id,gid)*6;
      if(sc>bs){ bs=sc; best=p.id; } });
    if(best) fr.forEach(f=>{ if(slotApplies(sl,f)&&av[f.id].has(best)&&!used[f.id].has(best)){ res[f.id][sl.id]=best; used[f.id].add(best); } });
  });
  // 2. forats: busca un segon titular que cobreixi tots (o el màxim) dels forats d'aquella plaça
  let changed=true, guard=0;
  while(changed&&guard++<20){ changed=false;
    order.forEach(sl=>{ const gid=sl.col.tipus==='grup'?sl.col.grup:null;
      const gaps=fr.filter(f=>slotApplies(sl,f)&&!res[f.id][sl.id]); if(!gaps.length) return;
      let best=null,bs=0;
      S.profs.forEach(p=>{ const c=gaps.filter(f=>av[f.id].has(p.id)&&!used[f.id].has(p.id)).length; if(!c) return;
        const sc=c*100+(gid?gaps.filter(f=>teachesAt(p.id,gid,dia,f.id)).length*10:0)-freeHours(p.id);
        if(best===null||sc>bs){ bs=sc; best=p.id; } });
      if(best){ gaps.forEach(f=>{ if(av[f.id].has(best)&&!used[f.id].has(best)){ res[f.id][sl.id]=best; used[f.id].add(best); } }); changed=true; }
    });
  }
  j.assign=res;
  const tot=fr.reduce((a,f)=>a+slots.filter(s=>slotApplies(s,f)).length,0); const cov=fr.reduce((a,f)=>a+Object.keys(res[f.id]).length,0);
  const per={}; fr.forEach(f=>Object.entries(res[f.id]).forEach(([s,p])=>{ (per[p]=per[p]||new Set()).add(s); }));
  const cont=Object.entries(per).filter(([p,set])=>set.size===1).length;
  return {cov,tot,cont};
}
function vAssignAct(){
  const fr=actFranges(), slots=actSlots(), cols=actCols();
  if(!fr.length||!slots.length) return `<div class="card empty"><h2>Falta definir l'activitat</h2><p>Indica les hores de l'activitat i què cal cobrir (grups o llocs).</p><button class="btn pri" data-a="tab" data-tab="activitat">Anar a Activitat</button></div>`;
  const dia=diaHorari(); const multi=cols.some(c=>(+c.n||0)>1);
  const head=`<div class="sec-h" style="margin-top:0"><div><h2>Assignació · ${esc(jTitol(S.jornada))}</h2><p>Toca una casella per triar el professor. Primer surten els que ja hi són a l'hora anterior o posterior, el tutor/a i qui fa classe a aquell grup.</p></div>
    <div class="row-actions"><button class="btn acc" data-a="asg-auto-act">Proposta automàtica</button><button class="btn danger" data-a="asg-clear-all">Buidar tot</button></div></div>
    <label class="check" style="margin-bottom:12px"><input type="checkbox" data-in="incfree" ${S.ui.incFree?'checked':''}> Incloure també professors presents que no tenen res a l'horari a aquella hora</label>`;
  const asgAt=fid=>(S.jornada.assign&&S.jornada.assign[fid])||{};
  const reserves={};
  const rows=fr.map((f,fi)=>{
    const asg=asgAt(f.id); const av=disponibles(f.id,S.ui.incFree); const avIds=new Set(av.map(x=>x.p.id));
    const where={}; slots.forEach(sl=>{ if(asg[sl.id]&&avIds.has(asg[sl.id])) where[asg[sl.id]]=sl.id; });
    const cov=Object.keys(where).length;
    reserves[f.id]=av.filter(x=>!where[x.p.id]).sort((x,y)=>profCmp(x.p,y.p)).map(x=>curt(x.p.nom));
    const prevA=fi>0?asgAt(fr[fi-1].id):{}, nextA=fi<fr.length-1?asgAt(fr[fi+1].id):{};
    const nApl=slots.filter(sl=>slotApplies(sl,f)).length;
    const cells=slots.map(sl=>{
      if(!slotApplies(sl,f)) return `<td class="na ${sl.k===1?'nvs':''}" title="Aquest grup no té classe en aquesta franja">—</td>`;
      const cur=asg[sl.id], ok=cur&&avIds.has(cur); const gid=sl.col.tipus==='grup'?sl.col.grup:null; const g=gid?grupById(gid):null;
      const rank=x=>(prevA[sl.id]===x.p.id||nextA[sl.id]===x.p.id)?0:(g&&g.tutor===x.p.id)?1:(gid&&x.a&&x.a.t==='G'&&x.a.grup===gid)?2:isClass(x.a)?3:x.a&&x.a.t==='GU'?4:5;
      const tag=x=>{ const r=rank(x); return r===0?'continuïtat':r===1?'tutor/a':actShort(x.a); };
      const lliures=av.filter(x=>!where[x.p.id]||x.p.id===cur).sort((x,y)=>rank(x)-rank(y)||profCmp(x.p,y.p));
      const ocupats=av.filter(x=>where[x.p.id]&&x.p.id!==cur).sort((x,y)=>profCmp(x.p,y.p));
      const slLab=s=>{ const sl2=slots.find(z=>z.id===s); return sl2?colNom(sl2.col)+((+sl2.col.n||0)>1?' ('+sl2.k+')':''):'?'; };
      const sel=`<select class="cellsel" data-in="asg" data-f="${f.id}" data-ag="${esc(sl.id)}" aria-label="${esc(colNom(sl.col))} ${esc(f.label)}">
        <option value="">${ok?'— Treure —':'Triar…'}</option>
        ${lliures.length?`<optgroup label="Lliures (${lliures.length})">${lliures.map(x=>`<option value="${x.p.id}" ${x.p.id===cur?'selected':''}>${esc(nomLl(x.p.nom))} · ${esc(tag(x))}</option>`).join('')}</optgroup>`:''}
        ${ocupats.length?`<optgroup label="Ja assignats (es mouran aquí)">${ocupats.map(x=>`<option value="${x.p.id}">${esc(nomLl(x.p.nom))} · ara a ${esc(slLab(where[x.p.id]))}</option>`).join('')}</optgroup>`:''}
      </select>`;
      const same=ok&&prevA[sl.id]===cur;
      return `<td class="cell ${ok?'p':'miss'} ${sl.k===1?'nvs':''} ${same?'cont':''}" title="${ok?esc(profById(cur).nom):''}"><span class="cv">${ok?esc(curt(profById(cur).nom)):'Triar…'}</span>${sel}</td>`;
    }).join('');
    const cls=cov>=nApl?'ok':cov?'warn':'bad';
    return `<tr><td class="hcol"><div class="hl">${esc(f.label)}</div><div class="hs"><i class="dot ${cls}"></i>${cov}/${nApl} · ${av.length} disp.</div></td>${cells}</tr>`;
  }).join('');
  const thead=multi?`<tr><th class="hcol" rowspan="2">Hora</th>${cols.map(c=>(+c.n||0)>1?`<th class="nvs" colspan="${c.n}">${esc(colNom(c))}</th>`:`<th class="nvs" rowspan="2">${esc(colNom(c))}${c.tipus==='lloc'?'<small>lloc</small>':''}</th>`).join('')}</tr>
    <tr>${slots.filter(sl=>(+sl.col.n||0)>1).map(sl=>`<th class="${sl.k===1?'nvs':''}">Prof. ${sl.k}</th>`).join('')}</tr>`
    :`<tr><th class="hcol">Hora</th>${cols.map(c=>`<th class="nvs">${esc(colNom(c))}${c.tipus==='lloc'?'<small>lloc</small>':''}</th>`).join('')}</tr>`;
  const table=`<div class="card tblw"><table class="t qg qa"><thead>${thead}</thead><tbody>${rows}</tbody></table></div>`;
  const resv=`<div class="card resv"><div class="resv-h">Professorat lliure (reserva) per hora</div>${fr.map(f=>`<div class="resv-r"><b>${esc(f.label)}</b><span>${reserves[f.id].length?`<em>${reserves[f.id].length}</em> `+esc(reserves[f.id].join(', ')):'<span class="hint">Ningú</span>'}</span></div>`).join('')}</div>`;
  return head+table+resv;
}

/* ----- 4. Resum (activitat) ----- */
function profPlaAct(pid){
  const fr=actFranges(), slots=actSlots();
  const coord=pEstat(pid)==='C';
  return fr.map(f=>{ const asg=(S.jornada.assign&&S.jornada.assign[f.id])||{}; const av=disponibles(f.id,S.ui.incFree).some(x=>x.p.id===pid);
    if(pAbs(pid).includes(f.id)) return {f,txt:'Absent',cls:'abs'};
    if(coord) return {f,txt:'Coordinació',cls:'co'};
    const sl=slots.find(s=>asg[s.id]===pid);
    if(sl&&av) return {f,txt:colNom(sl.col),cls:''};
    if(av) return {f,txt:'Reserva',cls:'res'};
    return {f,txt:'–',cls:'abs'}; });
}
function compacta(pla){ const out=[]; pla.forEach(x=>{ const l=out[out.length-1]; if(l&&l.txt===x.txt) l.to=x.f; else out.push({from:x.f,to:x.f,txt:x.txt}); }); return out; }
const hIni=f=>(f.label.match(/\d{1,2}[:.]\d{2}/)||[f.label])[0];
const hFi=f=>{ const m=f.label.match(/\d{1,2}[:.]\d{2}/g); return m&&m.length>1?m[1]:hIni(f); };
function vResumAct(){
  const fr=actFranges(), slots=actSlots(), cols=actCols();
  const P=S.profs.filter(p=>pEstat(p.id)==='P'), CO=S.profs.filter(p=>pEstat(p.id)==='C').sort(profCmp);
  const tot=fr.reduce((a,f)=>a+slots.filter(s=>slotApplies(s,f)).length,0); let cov=0; fr.forEach(f=>{ cov+=actCoverage(f.id).cov; });
  const assigned=P.filter(p=>profPlaAct(p.id).some(x=>x.cls===''&&x.txt!=='Reserva'));
  const grid=slots.length&&fr.length?`<div class="card tblw"><table class="t qg"><thead><tr><th class="hcol">Hora</th>${slots.map(sl=>`<th class="nvs">${esc(colNom(sl.col))}${(+sl.col.n||0)>1?'<small>prof. '+sl.k+'</small>':''}</th>`).join('')}</tr></thead><tbody>
    ${fr.map(f=>{ const asg=(S.jornada.assign&&S.jornada.assign[f.id])||{}; const ids=new Set(disponibles(f.id,S.ui.incFree).map(x=>x.p.id));
      return `<tr><td class="hcol">${esc(f.label)}</td>${slots.map(sl=>{ if(!slotApplies(sl,f)) return '<td class="na nvs">—</td>'; const pid=asg[sl.id]; return pid&&ids.has(pid)?`<td class="p nvs" title="${esc(profById(pid).nom)}">${esc(curt(profById(pid).nom))}</td>`:`<td class="miss nvs">Sense prof.</td>`; }).join('')}</tr>`; }).join('')}

const PDFLIB_URL = window.PDFLIB_URL || 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js';
let pdfLibP=null;
function loadPdfLib(){
  if(window.PDFLib) return Promise.resolve(window.PDFLib);
  if(!pdfLibP) pdfLibP=new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src=PDFLIB_URL; sc.onload=()=>window.PDFLib?res(window.PDFLib):rej(new Error('pdf-lib')); sc.onerror=()=>{ pdfLibP=null; rej(new Error("No s'ha pogut carregar el generador de PDF")); }; document.head.appendChild(sc); });

const WINANSI_EXTRA='–—‘’“”•…€';
const pdfTxt=s=>String(s??'').replace(/[→]/g,'->').replace(/[^\x20-\x7E\xA0-\xFF–—‘’“”•…€]/g,'');
async function buildPdf(spec){
  const {PDFDocument,StandardFonts,rgb}=await loadPdfLib();
  const doc=await PDFDocument.create();
  const F=await doc.embedFont(StandardFonts.Helvetica), FB=await doc.embedFont(StandardFonts.HelveticaBold);
  const W=842,H=595,M=28; let page,y;
  const C={ink:rgb(.09,.09,.11),mut:rgb(.45,.45,.5),line:rgb(.86,.86,.89),head:rgb(.95,.95,.97),ok:rgb(.92,.97,.94),bad:rgb(.99,.92,.92),badT:rgb(.75,.17,.13),na:rgb(.93,.93,.95),pri:rgb(.25,.24,.73),pri2:rgb(.93,.93,.99),warn:rgb(1,.96,.88)};
  const newPage=()=>{ page=doc.addPage([W,H]); y=H-M; page.drawText(pdfTxt(spec.footer),{x:M,y:14,size:7,font:F,color:C.mut}); page.drawText(String(doc.getPageCount()),{x:W-M-10,y:14,size:7,font:F,color:C.mut}); };
  const fit=(t,f,sz,w)=>{ t=pdfTxt(t); if(f.widthOfTextAtSize(t,sz)<=w) return t; while(t.length>1&&f.widthOfTextAtSize(t+'…',sz)>w) t=t.slice(0,-1); return t+'…'; };
  const wrap=(t,f,sz,w)=>{ const words=pdfTxt(t).split(/\s+/); const lines=[]; let cur=''; words.forEach(wd=>{ const n=cur?cur+' '+wd:wd; if(f.widthOfTextAtSize(n,sz)<=w) cur=n; else { if(cur) lines.push(cur); cur=f.widthOfTextAtSize(wd,sz)<=w?wd:fit(wd,f,sz,w); } }); if(cur) lines.push(cur); return lines.length?lines:['']; };
  const text=(t,{size=10,bold=false,color=C.ink,x=M}={})=>{ page.drawText(pdfTxt(t),{x,y:y-size,size,font:bold?FB:F,color}); y-=size+4; };
  const para=(t,{size=9,color=C.ink}={})=>{ wrap(t,F,size,W-2*M).forEach(l=>{ if(y-size<M+20) newPage(); page.drawText(l,{x:M,y:y-size,size,font:F,color}); y-=size+3; }); y-=3; };
  const ensure=h=>{ if(y-h<M+20){ newPage(); return true; } return false; };
  // taula: cols=[{w}] ; head=[[{t,span,fill}]] ; rows=[[{t,fill,color,bold}]] ; opts.size, opts.wrapCols
  const table=(cols,head,rows,opts={})=>{
    const sz=opts.size||8, px=3, py=3+(opts.rowPad||0)/2, lh=sz+3;
    const xs=[]; let acc=M; cols.forEach(c=>{ xs.push(acc); acc+=c.w; });
    const drawHead=()=>{ head.forEach(hr=>{ let ci=0; const h=lh+6; hr.forEach(cell=>{ const span=cell.span||1; const x=xs[ci], w=cols.slice(ci,ci+span).reduce((a,c)=>a+c.w,0);
        page.drawRectangle({x,y:y-h,width:w,height:h,color:cell.fill||C.head,borderColor:C.line,borderWidth:.5});
        page.drawText(fit(cell.t,FB,sz,w-px*2),{x:x+px,y:y-3-sz,size:sz,font:FB,color:C.ink}); ci+=span; }); y-=h; }); };
    ensure((lh+6)*(head.length+1)); drawHead();
    rows.forEach(r=>{
      const linesPer=r.map((cell,ci)=>(opts.wrapCols||[]).includes(ci)?wrap(cell.t,cell.bold?FB:F,sz,cols[ci].w-px*2):[fit(cell.t,cell.bold?FB:F,sz,cols[ci].w-px*2)]);
      const nl=Math.max(...linesPer.map(l=>l.length)); const h=nl*lh+py*2-2;
      if(ensure(h)) drawHead();
      r.forEach((cell,ci)=>{ page.drawRectangle({x:xs[ci],y:y-h,width:cols[ci].w,height:h,color:cell.fill||rgb(1,1,1),borderColor:C.line,borderWidth:.5});
        const top=y-(h-(linesPer[ci].length*lh-2))/2; // centrat vertical
        linesPer[ci].forEach((l,li)=>page.drawText(l,{x:xs[ci]+px,y:top-sz-li*lh+1,size:sz,font:cell.bold?FB:F,color:cell.color||C.ink})); });
      y-=h;
    });
    y-=10;
  };

  const measure=(t,sz,bold)=>(bold?FB:F).widthOfTextAtSize(pdfTxt(t),sz);
  spec.render({text,para,table,ensure,newPage,measure,C,W,M,get y(){return y;},set y(v){y=v;}});
  return await doc.save();
}

/* ---------- Importar horaris des de PDF ---------- */
const PDFJS_BASE = (window.PDFJS_BASE) || 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/';
let pdfjsP=null;
function loadPdfjs(){
  if(!pdfjsP) pdfjsP=(async()=>{
    const lib=await import(PDFJS_BASE+'pdf.min.mjs');
    try{ globalThis.pdfjsWorker=await import(PDFJS_BASE+'pdf.worker.min.mjs'); }catch(e){}
    lib.GlobalWorkerOptions.workerSrc=PDFJS_BASE+'pdf.worker.min.mjs';
    return lib;
  })().catch(e=>{ pdfjsP=null; throw e; });
  return pdfjsP;
}
async function pdfPages(file){
  const lib=await loadPdfjs();
  const data=new Uint8Array(await file.arrayBuffer());
  const doc=await lib.getDocument({data,isEvalSupported:false,useSystemFonts:true,disableFontFace:true}).promise;
  const pages=[];
  for(let n=1;n<=doc.numPages;n++){
    const pg=await doc.getPage(n); const vp=pg.getViewport({scale:1});
    const tc=await pg.getTextContent();
    const items=tc.items.filter(it=>it.str&&it.str.trim()).map(it=>{
      const h=Math.abs(it.height||it.transform[3])||8;
      return {s:it.str.trim(),x:it.transform[4],y:vp.height-it.transform[5],w:it.width||0,h};
    });
    pages.push({items,W:vp.width,H:vp.height});
  }
  return pages;
}
const DAYRE=[[1,/^(dilluns|lunes|dl|ll|lu|monday)$/],[2,/^(dimarts|martes|dt|ma|tuesday)$/],[3,/^(dimecres|miercoles|dc|dx|mi|x|wednesday)$/],[4,/^(dijous|jueves|dj|ju|thursday)$/],[5,/^(divendres|viernes|dv|vi|friday)$/]];
function dayOfTxt(s){ const n=norm(s).replace(/[^a-z ]/g,' ').trim().split(/\s+/)[0]||''; for(const [d,re] of DAYRE) if(re.test(n)) return d; return 0; }
const TIMERE=/(\d{1,2})\s*[:.h]\s*(\d{2})/;
function median(a){ if(!a.length) return 0; const b=a.slice().sort((x,y)=>x-y); return b[Math.floor(b.length/2)]; }
function clusterBy(arr,key,tol){ const s=arr.slice().sort((a,b)=>key(a)-key(b)); const out=[]; s.forEach(it=>{ const g=out[out.length-1]; if(g&&Math.abs(key(it)-g.k)<=tol){ g.items.push(it); } else out.push({k:key(it),items:[it]}); }); return out; }

function rowsFrom(tl,lh){
  const groups=[];
  tl.forEach(i=>{ const g=groups[groups.length-1]; if(g&&i.y-g.last<=lh*1.9){ g.last=i.y; g.items.push(i); } else groups.push({first:i.y,last:i.y,items:[i]}); });
  return groups.map(g=>{ const ts=[]; g.items.forEach(i=>{ const re=new RegExp(TIMERE.source,'g'); let m; while((m=re.exec(i.s))) ts.push((+m[1])+':'+m[2]); });
    const t=ts[0]; const te=ts.find(x=>x!==t)||null; return {t,te,f:parseFranja(t),c:(g.first+g.last)/2-lh*0.35,top:g.first}; });
}
const isTimeLabel=(i,left,firstC)=>TIMERE.test(i.s)&&(i.x+i.w/2<left+2||i.x+i.w<firstC-2)&&i.s.replace(TIMERE,'').replace(TIMERE,'').replace(/[\s\-–a]/gi,'').length<=2;
function assignCells(body,bounds,rows,rowPitch,lh,raw,y0,y1){
  bounds.forEach(b=>{
    const its=body.filter(i=>{ const cx=i.x+i.w/2; return cx>=b.l&&cx<b.r&&i.y>=y0&&i.y<=y1&&(!TIMERE.test(i.s)||i.s.length>12); });
    const lines=clusterBy(its,i=>i.y,lh*0.45).map(g=>({y:g.k,t:g.items.sort((a,b)=>a.x-b.x).map(i=>i.s).join(' ')}));
    let blobs=[]; lines.forEach(l=>{ const bl=blobs[blobs.length-1]; if(bl&&l.y-bl.last<=lh*1.6){ bl.last=l.y; bl.lines.push(l); } else blobs.push({first:l.y,last:l.y,lines:[l]}); });
    const split=[]; blobs.forEach(bl=>{ let cur=[bl.lines[0]]; for(let k=1;k<bl.lines.length;k++){ const nearPrev=rows.reduce((a,r)=>Math.abs(r.c-cur[0].y)<Math.abs(a.c-cur[0].y)?r:a); const nearThis=rows.reduce((a,r)=>Math.abs(r.c-bl.lines[k].y)<Math.abs(a.c-bl.lines[k].y)?r:a); if(bl.lines[k].y-cur[0].y>rowPitch*0.8&&nearPrev!==nearThis){ split.push(cur); cur=[]; } cur.push(bl.lines[k]); } split.push(cur); });
    split.forEach(ls=>{
      const c=(ls[0].y+ls[ls.length-1].y)/2;
      const r=rows.reduce((a,x)=>Math.abs(x.c-c)<Math.abs(a.c-c)?x:a);
      if(!r.f) return;
      const txt=ls.map(l=>l.t).join(' · ');
      if(/^pati$|^esbarjo$|^recreo$/i.test(norm(txt))) return;
      const k=b.d+'-'+r.f; raw[k]=raw[k]?raw[k]+' · '+txt:txt;
    });
  });
}
function finishCells(blk){
  const pq=parts(blk.name), own=new Set([norm(pq.nom+' '+(pq.cog.split(' ')[0]||'')),norm(pq.nom+' '+pq.cog),norm(blk.name)].filter(x=>x.includes(' ')));
  const cells={};
  Object.keys(blk.raw).forEach(k=>{ blk.raw[k]=blk.raw[k].split(' · ').filter(l=>!own.has(norm(l))).join(' · '); });
  Object.entries(blk.raw).forEach(([k,t])=>{ const v=actFrom(t); if(v) cells[k]=v; });
  blk.cells=cells;
}
// Pàgina sense capçalera de dies: continuació de la graella de la pàgina anterior (files partides)
function continuePage(page,pb){
  const g=pb&&pb._geo; if(!g||g.swapped) return false;
  const H=page.H, lh=g.lh;
  const items=page.items.filter(i=>i.y>34&&i.y<H-30&&!/^\d+\s*\/\s*\d+$/.test(i.s)&&!/^https?:/i.test(i.s)&&!/^\d{1,2}\/\d{1,2}\/\d{2,4}/.test(i.s)&&!/-\s*horari\s*$/i.test(i.s));
  if(!items.length) return false;
  const left=g.bounds[0].l, right=g.bounds[g.bounds.length-1].r;
  if(!items.some(i=>i.x+i.w/2>=left&&i.x+i.w/2<=right)) return false;
  const tl=items.filter(i=>isTimeLabel(i,left,g.ds[0].c)).sort((a,b)=>a.y-b.y||a.x-b.x);
  const rows=rowsFrom(tl,lh);
  const firstTop=rows.length?rows[0].top-lh*1.2:Infinity;
  // 1) el que hi ha abans de la primera hora és la resta de l'última fila de la pàgina anterior
  const carry=items.filter(i=>i.y<firstTop&&!TIMERE.test(i.s));
  if(carry.length&&g.lastF){
    g.bounds.forEach(b=>{ const its=carry.filter(i=>{ const cx=i.x+i.w/2; return cx>=b.l&&cx<b.r; });
      if(!its.length) return; const txt=clusterBy(its,i=>i.y,lh*0.45).map(x=>x.items.sort((a,c)=>a.x-c.x).map(i=>i.s).join(' ')).join(' · ');
      const k=b.d+'-'+g.lastF; pb.raw[k]=pb.raw[k]?pb.raw[k]+' · '+txt:txt; });
  }
  // 2) files noves en aquesta pàgina
  if(rows.length){
    const rowPitch=rows.length>1?median(rows.slice(1).map((r,k)=>r.c-rows[k].c)):g.rowPitch;
    assignCells(items,g.bounds,rows,rowPitch,lh,pb.raw,rows[0].c-rowPitch*0.75,rows[rows.length-1].c+rowPitch*0.75);
    rows.forEach(r=>{ pb.rowsInfo.push({t:r.t,te:r.te}); if(!r.f) pb.badRows.push(r.t); });
    const lastOk=rows.filter(r=>r.f).pop(); if(lastOk) g.lastF=lastOk.f;
  }
  finishCells(pb);
  return true;
}
function parseTimetablePage(page,fallbackName){
  let items=page.items; const lh=median(items.map(i=>i.h))||9;
  const findHeaders=its=>{
    const days=its.filter(i=>dayOfTxt(i.s));
    return clusterBy(days,i=>i.y,lh*0.6).map(g=>{ const m={}; g.items.forEach(i=>{ const d=dayOfTxt(i.s); if(!m[d]) m[d]=i; }); return {y:g.k,days:m}; }).filter(h=>Object.keys(h.days).length>=3);
  };
  const orig=items; let swapped=false;
  let headers=findHeaders(items);
  if(!headers.length){ // els dies van en files (format aSc): girem la graella
    const sw=items.map(i=>({s:i.s,x:i.y-i.h/2,y:i.x+i.w/2,w:i.h,h:lh,_o:i}));
    const h2=findHeaders(sw); if(h2.length){ items=sw; headers=h2.slice(0,1); swapped=true; }
  }
  if(!headers.length) return [];
  headers.sort((a,b)=>a.y-b.y);
  const blocks=[];
  headers.forEach((hd,bi)=>{
    const yEnd=bi<headers.length-1?headers[bi+1].y-lh*1.5:Infinity;
    const yStartName=bi>0?(blocks[bi-1]._maxY||headers[bi-1].y):-Infinity;
    // columnes
    const ds=Object.entries(hd.days).map(([d,i])=>({d:+d,c:i.x+i.w/2})).sort((a,b)=>a.c-b.c);
    const pitch=ds.length>1?(ds[ds.length-1].c-ds[0].c)/(ds.length-1):100;
    const bounds=ds.map((o,k)=>({d:o.d,l:k?(ds[k-1].c+o.c)/2:o.c-pitch/2,r:k<ds.length-1?(o.c+ds[k+1].c)/2:o.c+pitch/2}));
    const left=bounds[0].l;
    const body=items.filter(i=>i.y>hd.y+lh*0.4&&i.y<yEnd);
    // etiquetes d'hora a l'esquerra
    const tl=body.filter(i=>isTimeLabel(i,left,ds[0].c)).sort((a,b)=>a.y-b.y||a.x-b.x);
    const rows=rowsFrom(tl,lh);
    if(!rows.length) return;
    const rowPitch=rows.length>1?median(rows.slice(1).map((r,k)=>r.c-rows[k].c)):lh*5;
    const lastRowEnd=rows[rows.length-1].c+rowPitch*0.75;
    // contingut de cada columna -> blocs de línies -> fila més propera
    const raw={};
    assignCells(body,bounds,rows,rowPitch,lh,raw,rows[0].c-rowPitch*0.75,lastRowEnd);
    // nom del professor
    let above;
    if(swapped){ const top=Math.min(...tl.map(i=>i._o.y-i._o.h), ...Object.values(hd.days).map(i=>i._o.y-i._o.h)); above=orig.filter(i=>i.y<top-lh*0.3&&!dayOfTxt(i.s)&&!/^\d{1,2}$/.test(i.s)); }
    else above=items.filter(i=>i.y<hd.y-lh*0.3&&i.y>yStartName&&!dayOfTxt(i.s));
    const aLines=clusterBy(above,i=>i.y,lh*0.45).map(g=>({y:g.k,h:Math.max(...g.items.map(i=>i.h)),t:g.items.sort((a,b)=>a.x-b.x).map(i=>i.s).join(' ').replace(/\s+/g,' ').trim()}));
    let name='';
    for(const l of aLines.slice().reverse()){ const m=l.t.match(/(?:professor(?:\/a|a)?|docent|nom(?: i cognoms)?|profesor(?:\/a|a)?)\s*[:\-–]\s*(.+)$/i); if(m){ name=m[1]; break; } }
    if(!name){ const cand=aLines.filter(l=>/[a-zà-ú]{2}/i.test(l.t)&&!/institut|escola|^ins\b|^ies\b|curs\s*\d|^\d|p[aà]gina|generat|horari\s*$|centre/i.test(norm(l.t))&&!TIMERE.test(l.t));
      if(cand.length){ const maxH=Math.max(...cand.map(c=>c.h)); const best=cand.filter(c=>c.h>=maxH-0.5).pop(); name=best.t; } }
    name=name.replace(/^(horari\s+(del?\s+)?(professor(\/a|a)?\s+)?|horario\s+(de(l)?\s+)?(profesor(\/a|a)?\s+)?)/i,'').replace(/^[:\-–\s]+/,'').replace(/\s*[-–·|]\s*curs.*$/i,'').replace(/["«»“”]/g,'').trim();
    if(name && name===name.toUpperCase() && /[A-ZÀ-Ú]/.test(name)) name=name.toLowerCase().replace(/(^|[\s,'’\-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase()).replace(/\b(De|Del|I|La|Les|Dels)\b(?!,)/g,w=>w.toLowerCase());
    if(!name&&headers.length===1) name=fallbackName||'';
    // treu el nom del mateix professor que iEduca repeteix a cada casella i interpreta cada casella
    const blk={name,cells:{},raw,_maxY:Math.max(lastRowEnd,hd.y),nDays:ds.length,nRows:rows.filter(r=>r.f).length,badRows:rows.filter(r=>!r.f).map(r=>r.t),rowsInfo:rows.map(r=>({t:r.t,te:r.te})),
      _geo:{bounds,ds,rowPitch,lh,swapped,lastF:(rows.filter(r=>r.f).pop()||{}).f}};
    finishCells(blk); blocks.push(blk);
  });
  return blocks;
}

let pdfImport=[], pdfCache=[];
function pdfParseAll(prev){
  pdfImport=[];
  pdfCache.forEach(({name,pages})=>{ const base=name.replace(/\.pdf$/i,'').replace(/[_]+/g,' ');
    let last=null;
    pages.forEach((pg,pi)=>{ const bl=parseTimetablePage(pg,pages.length===1?base:'');
      if(!bl.length){ if(last&&continuePage(pg,last)) last.on=Object.keys(last.cells).length>0; return; }
      bl.forEach(b=>{ b.file=name; b.page=pi+1; b.on=Object.keys(b.cells).length>0; pdfImport.push(b); last=b; }); }); });
  if(prev) pdfImport.forEach((b,i)=>{ const o=prev[i]; if(o&&o.file===b.file&&o.page===b.page){ b.name=o.name; if(o.nc>0) b.on=o.on&&Object.keys(b.cells).length>0; } });
}
const toMin=t=>{ const [h,m]=t.split(':').map(Number); return h*60+m; };
function pdfFranges(){
  const map={};
  pdfImport.forEach(b=>(b.rowsInfo||[]).forEach(r=>{ if(r.t&&!map[r.t]) map[r.t]=r.te; else if(r.t&&r.te&&!map[r.t]) map[r.t]=r.te; }));
  const ts=Object.keys(map).sort((a,b)=>toMin(a)-toMin(b));
  return ts.map((t,i)=>{ const te=map[t]||ts[i+1]||null; const dur=te?toMin(te)-toMin(t):60;
    const pati=dur<=35; const lect=!pati&&toMin(t)<15*60;
    return {id:'h'+t.replace(':',''),label:t+(te?' – '+te:'')+(pati?' · Pati':''),lect}; });
}
function findProf(name){
  const n=norm(name); if(!n) return null;
  const q=parts(name);
  const exact=S.profs.find(p=>{ const a=parts(p.nom); return norm(p.nom)===n||norm(a.cog+', '+a.nom)===n||norm(a.nom+' '+a.cog)===n||(norm(a.cog)===norm(q.cog)&&norm(a.nom)===norm(q.nom)); });
  if(exact) return exact;
  // mateix nom i primer cognom (p. ex. «Ferrer Coll, Jaume» = «Jaume Ferrer»), només si és únic
  const c1=w=>norm(w).split(' ')[0];
  const cands=S.profs.filter(p=>{ const a=parts(p.nom); return norm(a.nom)===norm(q.nom)&&c1(a.cog)&&c1(a.cog)===c1(q.cog); });
  return cands.length===1?cands[0]:null;
}
function pdfModal(){
  openModal(`<div class="modal-h"><h2>Importar horaris des de PDF <span class="badge">v. ${VERSIO}</span></h2><button class="x" data-a="close">×</button></div>
    <div class="modal-b"><p style="margin-top:0">Tria un o diversos PDF d'horaris (un professor per pàgina o diversos per pàgina). L'app llegeix la graella i et mostra què ha entès <b>abans de desar res</b>.</p>
    <p class="hint">Funciona amb PDF generats pel programa d'horaris (amb text seleccionable). Les franges es casen per l'hora d'inici amb les de Configuració.</p>
    <div class="field"><label>Fitxers PDF</label><input type="file" id="pdfFiles" accept="application/pdf,.pdf" multiple></div>
    <div id="pdfMsg"></div><div id="pdfRes"></div></div>
    <div class="modal-f" id="pdfFoot"><button class="btn" data-a="close">Cancel·lar</button></div>`,true);
  $('#pdfFiles').onchange=async e=>{
    const files=[...e.target.files]; if(!files.length) return;
    $('#pdfMsg').innerHTML='<div class="banner info">Llegint els PDF…</div>'; $('#pdfRes').innerHTML='';
    pdfImport=[]; pdfCache=[]; let noText=0;
    try{
      for(const f of files){
        const pages=await pdfPages(f);
        if(pages.every(p=>!p.items.length)) noText++;
        pdfCache.push({name:f.name,pages});
      }

/* ---------- Imports ---------- */
function parseRows(txt){
  const lines=txt.replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length) return [];
  const d=lines[0].includes('\t')?'\t':lines[0].includes(';')?';':',';
  return lines.map(l=>l.split(d).map(c=>c.trim().replace(/^"(.*)"$/,'$1').trim()));
}
const isHeader=(r,re)=>re.test(norm(r[0]));
function impGrups(txt,mode){

  const nous=rows.filter(r=>r[0]).map(r=>{
    let nom=r[0],niv='',alu=0;
    if(r.length>=3){ niv=r[1]; alu=parseInt(r[2])||0; }
    else if(r.length===2){ if(/^\d+$/.test(r[1])) alu=+r[1]; else niv=r[1]; }
    return {nom,nivell:niv||nivellDe(nom),alumnes:alu};

  const byName=Object.fromEntries(S.grups.map(g=>[norm(g.nom),g]));
  const out=mode==='replace'?[]:S.grups.slice();
  nous.forEach(n=>{
    const ex=byName[norm(n.nom)];
    if(ex){ ex.nom=n.nom; ex.nivell=n.nivell; ex.alumnes=n.alumnes; if(mode==='replace') out.push(ex); }
    else out.push({id:uid(),...n});

  return `${nous.length} grups importats.`;
}
function impProfs(txt,mode){

  const nous=rows.filter(r=>r[0]).map(r=>({nom:r[0],dept:r[1]||''}));

  const byName=Object.fromEntries(S.profs.map(p=>[norm(p.nom),p]));

  if(mode==='replace'){ const keep=new Set(out.map(p=>p.id)); Object.keys(S.horari).forEach(id=>{ if(!keep.has(id)) delete S.horari[id]; }); saveHorari(); }
  S.profs=out; saveProfs();

}
function parseDia(s){
  const n=norm(s).replace(/\./g,'');
  if(/^[1-5]$/.test(n)) return +n;
  const map=[[1,/^(dl|dilluns|lunes|l|lu)$/],[2,/^(dt|dimarts|martes|m|ma)$/],[3,/^(dc|dimecres|miercoles|x|mi)$/],[4,/^(dj|dijous|jueves|j|ju)$/],[5,/^(dv|divendres|viernes|v|vi)$/]];
  for(const [d,re] of map) if(re.test(n)) return d;
  for(const [d,w] of [[1,'dilluns'],[2,'dimarts'],[3,'dimecres'],[4,'dijous'],[5,'divendres']]) if(n.startsWith(w.slice(0,4))) return d;
  return null;
}
function parseFranja(s){
  const t=String(s).trim();
  if(/^\d+$/.test(t)){ const f=S.config.franges[+t-1]; return f?f.id:null; }
  const m=t.match(/(\d{1,2})[:.h](\d{2})/);
  if(m){ const key=(+m[1])+':'+m[2]; const f=S.config.franges.find(fr=>{ const mm=fr.label.match(/(\d{1,2})[:.h](\d{2})/); return mm&&((+mm[1])+':'+mm[2])===key; }); return f?f.id:null; }
  const f=S.config.franges.find(fr=>norm(fr.label)===norm(t)); return f?f.id:null;
}
const gKey=s=>norm(s).replace(/\b(\d)(r|n|t|er|o|º|a)\b/g,'$1').replace(/[^a-z0-9]/g,'');
function matchGrup(txt){
  const k=gKey(txt); if(!k) return null;
  let best=null;
  S.grups.forEach(g=>{ const gk=gKey(g.nom); if(gk && (k===gk || k.includes(gk)) && (!best||gk.length>gKey(best.nom).length)) best=g; });
  return best;
}
function grupInfo(g){
  const n=norm(g.nom+' '+(g.nivell||''));
  const num=(n.match(/[1-4]/)||[])[0]||'';
  const stage=/bat|bach/.test(n)?'B':/cf|cicle|ciclo|fp|pfi/.test(n)?'F':'E';
  const lt=(norm(g.nom).match(/(?:^|[^a-z0-9])([a-h])\s*$/)||[])[1]||'';
  return {num,stage,lt};
}
const STG='(eso|batxillerat|bachillerato|batx|bach|bat)';
function lettersBetween(a,b){ const out=[]; for(let c=a.charCodeAt(0);c<=b.charCodeAt(0);c++) out.push(String.fromCharCode(c)); return out; }
function classRef(txt){
  const n=norm(txt);
  // grups desdoblats / agrupats: «Castellà A-B 1r», «A-E 3r», «1r A-B», «2n ESO A/C»
  const rr=[new RegExp("(?:^|[^a-z0-9])([a-h])\\s*[-–/]\\s*([a-h])\\s+([1-4])\\s*(?:r|n|t|er|o|a)?\\s*"+STG+"?(?=$|[^a-z0-9])"),
            new RegExp("(?:^|[^a-z0-9])([1-4])\\s*(?:r|n|t|er|o|a)?\\s*"+STG+"?\\s*([a-h])\\s*[-–/]\\s*([a-h])(?=$|[^a-z0-9])")];
  for(let k=0;k<2;k++){ const m=n.match(rr[k]); if(!m) continue;
    const num=k?m[1]:m[3], st=k?m[2]:m[4], l1=k?m[3]:m[1], l2=k?m[4]:m[2];
    const stage=st?(/bat|bach/.test(st)?'B':'E'):null; const lts=l1<=l2?lettersBetween(l1,l2):[l1,l2];
    const info=S.grups.map(g=>({g,...grupInfo(g)}));
    let c=info.filter(x=>x.num===num&&(stage?x.stage===stage:x.stage==='E')&&lts.includes(x.lt));
    if(!c.length&&!stage) c=info.filter(x=>x.num===num&&lts.includes(x.lt));
    if(c.length===1) return {g:c[0].g};
    const nivs=[...new Set(c.map(x=>x.g.nivell))];
    if(nivs.length===1) return {txt:nivs[0]};
    return {txt:num+(num==='1'?'r':num==='2'?'n':num==='3'?'r':'t')+' '+(stage==='B'?'Batx':'ESO')};
  }
  const re=/(?:^|[^a-z0-9])([1-4])\s*(r|n|t|er|o|a)?\s*(?:de\s+|d')?(eso|batxillerat|bachillerato|batx|bach|bat)?\s*[-.]?\s*([a-h])?(?=$|[^a-z0-9])/g;
  let m, refs=[];
  // compta si hi ha etapa (ESO/Batx), lletra de grup o un ordinal clar (1r, 2n, 3r, 4t): «OPT EMPRENEDORIA 4t»
  while((m=re.exec(n))){ const ord=m[2]&&/^(r|n|t|er)$/.test(m[2]); if(m[3]||m[4]||ord) refs.push({num:m[1],stage:m[3]?(/bat|bach/.test(m[3])?'B':'E'):null,lt:m[4]||''}); if(re.lastIndex===m.index) re.lastIndex++; }
  if(!refs.length) return null;
  const r=refs.filter(x=>x.lt).pop()||refs[refs.length-1];
  const info=S.grups.map(g=>({g,...grupInfo(g)}));
  let c=info.filter(x=>x.num===r.num&&(r.stage?x.stage===r.stage:x.stage==='E')&&(!r.lt||x.lt===r.lt));
  if(!c.length&&!r.stage) c=info.filter(x=>x.num===r.num&&(!r.lt||x.lt===r.lt));
  if(c.length===1) return {g:c[0].g};
  if(c.length>1){ const nivs=[...new Set(c.map(x=>x.g.nivell))]; if(nivs.length===1) return {txt:nivs[0]}; }
  if(r.stage==='B'||r.stage==='E') return {txt:r.num+(r.num==='1'?'r':r.num==='2'?'n':r.num==='3'?'r':'t')+' '+(r.stage==='B'?'Batx':'ESO')+(r.lt?' '+r.lt.toUpperCase():'')};
  return null;
}
function actFrom(txt){
  const t=String(txt||'').trim(); if(!t) return null;
  if(/gu[aà]rdi/i.test(t)) return 'GU';
  if(/\b(reunio|reunion|claustre|claustro|comissio|comision|coordinacio|coordinacion|cicle|departament|departamento|dept)\b/.test(norm(t))) return 'AL:'+t;
  const g=matchGrup(t); if(g) return 'G:'+g.id;
  const c=classRef(t); if(c) return c.g?'G:'+c.g.id:'C:'+c.txt;
  return 'AL:'+t;
}
function impHorari(txt,mode){
  let rows=parseRows(txt).filter(r=>r.some(c=>c));
  if(!rows.length) throw new Error("No s'ha trobat cap sessió.");
  // Format ampli: Professor;Dia;8:00;9:00;...  (una fila per professor i dia)
  const cols=rows[0].map((c,j)=>j>=2&&c?parseFranja(c):null);
  const wide=cols.filter(Boolean).length>=2;
  if(!wide && isHeader(rows[0],/^(professor|nom|docent|cognom)/)) rows=rows.slice(1);
  if(wide) rows=rows.slice(1);
  const byName=Object.fromEntries(S.profs.map(p=>[norm(p.nom),p]));
  // també casa «Nom Cognoms» amb «Cognoms, Nom»
  S.profs.forEach(p=>{ const q=parts(p.nom); byName[norm(q.nom+' '+q.cog)]=byName[norm(q.nom+' '+q.cog)]||p; byName[norm(q.cog+', '+q.nom)]=byName[norm(q.cog+', '+q.nom)]||p; });

  const getP=nom=>{ let p=byName[norm(nom)]; if(!p){ p={id:uid(),nom:nom.trim(),dept:''}; S.profs.push(p); byName[norm(nom)]=p; nousP++; }
    if(mode==='replace' && !tocats.has(p.id)){ S.horari[p.id]={}; tocats.add(p.id); }
    S.horari[p.id]=S.horari[p.id]||{}; return p; };
  const put=(p,d,f,act)=>{ const v=actFrom(act); const k=d+'-'+f; if(v){ S.horari[p.id][k]=v; ok++; if(v.startsWith('AL:')) altres.add(act.trim()); } else if(wide) delete S.horari[p.id][k]; };
  rows.forEach((r,i)=>{
    const nom=(r[0]||'').trim(); if(!nom) return;
    const d=parseDia(r[1]||'');
    if(!d){ errs.push(`Línia ${i+2}: dia «${r[1]||''}» no reconegut`); return; }
    if(wide){
      const p=getP(nom);
      cols.forEach((f,j)=>{ if(f) put(p,d,f,r[j]||''); });
    } else {
      if(r.length<4){ errs.push(`Línia ${i+1}: calen 4 columnes`); return; }
      const f=parseFranja(r[2]);
      if(!f){ errs.push(`Línia ${i+1}: franja «${r[2]}» no reconeguda`); return; }
      put(getP(nom),d,f,r.slice(3).join(' '));

  });

  let msg=`${ok} sessions importades${nousP?`, ${nousP} professors nous`:''}.`;
  if(altres.size) msg+=` ${altres.size} activitats no són ni grup ni guàrdia (no compten): ${[...altres].slice(0,3).join(', ')}${altres.size>3?'…':''}.`;
  if(errs.length) msg+=` ${errs.length} línies amb errors.`;
  return msg;
}

function seeded(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function demoData(){

  const dlist=[]; depts.forEach(([d,n])=>{ for(let i=0;i<n;i++) dlist.push(d); });
  const used=new Set(), profs=[];

function demoJornada(){
  const rnd=seeded(777);
  const wd=new Date(S.jornadaId+'T12:00:00').getDay();
  S.jornada={tipus:'vaga',data:S.jornadaId.slice(0,10),alumnes:{},profs:{},agr:{},assign:{},diaHorari:(wd===0||wd===6)?3:null};
  S.jornades[S.jornadaId]=S.jornada;
  const taxa={'1r ESO':.62,'2n ESO':.55,'3r ESO':.45,'4t ESO':.38,'1r Batx':.25,'2n Batx':.35};
  S.grups.forEach(g=>{ const t=(taxa[g.nivell]||.5)+(rnd()-.5)*.2; S.jornada.alumnes[g.id]=Math.max(0,Math.round(g.alumnes*t)); });
  const lect=lectFranges();
  S.profs.forEach(p=>{ S.jornada.profs[p.id]= rnd()<.4 ? {e:'V',abs:[]} : {e:'P',abs:[]}; });
  // dos professors arriben més tard
  S.profs.filter(p=>S.jornada.profs[p.id].e==='P').slice(0,2).forEach(p=>{ S.jornada.profs[p.id].abs=[lect[0].id]; });
  lect.forEach((f,i)=>autoAssign(f.id,i>0?lect[i-1].id:null));
  saveJ();
}

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { initializeFirestore, persistentLocalCache, doc, collection, onSnapshot, setDoc, deleteDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const C = window.JORNADES_FB, dom = C.domini.toLowerCase().replace(/^@/, '');
const llista = (C.autoritzats || []).map(e => e.toLowerCase().trim()).filter(Boolean);
const app = initializeApp(C.config), auth = getAuth(app);
const fs = initializeFirestore(app, { localCache: persistentLocalCache() });
const L = document.getElementById('login'), M = document.getElementById('lMsg');
document.getElementById('lFoot').textContent = 'Només comptes @' + dom + (llista.length ? ' autoritzats' : '');
const valid = u => u && u.emailVerified && u.email && u.email.toLowerCase().endsWith('@' + dom) && (!llista.length || llista.includes(u.email.toLowerCase()));
const err = e => { const c = e && e.code || ''; return { code: c === 'permission-denied' ? 'invalid_argument' : (c === 'unavailable' || c === 'deadline-exceeded') ? 'unavailable' : c === 'resource-exhausted' ? 'quota_exceeded' : 'unavailable', message: e && e.message || '' }; };
const wrapDoc = s => ({ id: s.id, exists: s.exists(), data: () => s.data(), metadata: s.metadata });
const db = {
  doc: p => ({
    path: p,
    set: d => setDoc(doc(fs, p), d).catch(e => { throw err(e); }),
    delete: () => deleteDoc(doc(fs, p)).catch(e => { throw err(e); }),
    onSnapshot: (next, bad) => onSnapshot(doc(fs, p), { includeMetadataChanges: true }, s => next(wrapDoc(s)), e => bad && bad(err(e)))
  }),
  collection: p => ({
    onSnapshot: (next, bad) => onSnapshot(collection(fs, p), { includeMetadataChanges: true }, q => next({ docs: q.docs.map(wrapDoc), size: q.size, empty: q.empty, metadata: q.metadata }), e => bad && bad(err(e)))
  })
};
document.getElementById('gLogin').onclick = async () => {
  M.textContent = '';
  const p = new GoogleAuthProvider(); p.setCustomParameters({ hd: dom, prompt: 'select_account' });
  try { await signInWithPopup(auth, p); }
  catch (e) {
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') await signInWithRedirect(auth, p);
    else if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') M.textContent = "No s'ha pogut entrar: " + (e.code || e.message);
  }
};
let ready = false;
onAuthStateChanged(auth, async u => {
  if (!u) { if (ready) location.reload(); L.hidden = false; return; }
  if (!valid(u)) { const em = u.email; await signOut(auth); L.hidden = false; M.textContent = `El compte ${em} no té accés. Entra amb un compte @${dom}${llista.length ? ' autoritzat' : ''}.`; return; }
  L.hidden = true;
  if (!ready) { ready = true; window.__fbResolve({ db, email: u.email, signOut: () => signOut(auth) }); }
});
</script>
